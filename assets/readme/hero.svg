<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">橡胶戳印记 Rubber Stamp — 296 枚手工雕刻图章画廊</title>
  <desc id="desc">暖纸底标题：橡胶戳印记；右侧是一枚图章卡：线刻山峦、宝塔与落日，右下角盖着一枚朱红小印。</desc>

  <rect width="1200" height="360" rx="26" fill="#f3ead8"/>

  <g id="deco" opacity="0.6">
    <circle cx="704" cy="54" r="9" fill="#e0d0a8"/>
    <circle cx="730" cy="54" r="5" fill="#e0d0a8"/>
    <circle cx="62" cy="324" r="8" fill="#e0d0a8"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#8a5a2b">橡皮图章画廊 · RUBBER STAMP GALLERY</text>
    <text x="56" y="130" font-size="60" font-weight="700" fill="#2b2118">橡胶戳印记</text>
    <text x="56" y="170" font-size="23" fill="#a63a24">RUBBER STAMP — 296 枚手工雕刻图章</text>
    <text x="56" y="206" font-size="19" fill="#5c4a38">世界城市、名胜风景、古诗名句……十一大系列，一枚一世界。</text>
    <g id="chips" font-size="18" fill="#f3ead8" text-anchor="middle">
      <g><rect x="56" y="238" width="122" height="36" rx="18" fill="#2b2118"/><text x="117" y="262">296 枚作品</text></g>
      <g><rect x="190" y="238" width="122" height="36" rx="18" fill="#2b2118"/><text x="251" y="262">11 个系列</text></g>
      <g><rect x="324" y="238" width="140" height="36" rx="18" fill="#2b2118"/><text x="394" y="262">点赞收藏</text></g>
      <g><rect x="476" y="238" width="158" height="36" rx="18" fill="#2b2118"/><text x="555" y="262">ZIP 打包下载</text></g>
    </g>
  </g>

  <g id="stamp-card" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="800" y="44" width="344" height="272" rx="12" fill="#faf5e8" stroke="#d8c9a8" stroke-width="1.5"/>
    <text x="828" y="76" font-size="18" fill="#5c4a38">手工雕刻图章 · HAND-CARVED</text>
    <g id="stamp-frame">
      <rect x="828" y="88" width="200" height="176" rx="8" fill="#f7efdc" stroke="#2b2118" stroke-width="2.5"/>
      <circle cx="984" cy="120" r="14" fill="#c97b2d"/>
      <polyline points="840,252 872,196 898,224 928,178 956,218 982,192 1016,226" fill="none" stroke="#2b2118" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="pagoda" fill="#2b2118">
        <rect x="858" y="232" width="36" height="12"/>
        <polygon points="854,232 876,214 898,232"/>
        <rect x="864" y="204" width="24" height="10"/>
        <polygon points="861,204 876,192 891,204"/>
      </g>
      <g id="water" stroke="#2b2118" stroke-width="2" opacity="0.55" stroke-linecap="round">
        <line x1="920" y1="244" x2="1008" y2="244"/>
        <line x1="940" y1="254" x2="1000" y2="254"/>
      </g>
    </g>
    <text x="828" y="300" font-size="18" fill="#5c4a38">一枚一世界</text>
    <g id="seal">
      <rect x="1044" y="232" width="48" height="48" rx="6" fill="#9c2f1d"/>
      <text x="1068" y="266" font-size="28" font-weight="700" fill="#faf5e8" text-anchor="middle">印</text>
    </g>
  </g>
</svg>
