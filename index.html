<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,viewport-fit=cover">
  <title>rubber world · 极简橡胶戳艺术印记</title>
  <meta name="description" content="rubber world · 精选名胜风景、古诗名句、世界城市、游戏神作、珍稀动物、海洋生物、大气奇观等全站共276枚极简多色橡胶戳印艺术作品。附带原始作图Prompt与分类筛选。">

  <!-- Analytics -->
  <script
    defer
    src="https://cloud.umami.is/script.js"
    data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"
    data-domains="holynova.github.io,xiaosang.cc"
    data-exclude-search="true"
    data-exclude-hash="true"
  ></script>

  <style>
    :root {
      --paper: #f5efe6;
      --paper-card: #ffffff;
      --paper-pop: #ffffff;
      --ink: #222222;
      --muted: #888888;
      --line: #e8e0d4;
      --line-dark: #d5cbbe;
      --accent: #ff2442; /* Xiaohongshu Signature Red */
      --accent-hover: #e01b37;
      --seal-red: #b9281e;
      --tab-active: #222222;
      --tab-active-text: #ffffff;
      --code-bg: #2b2724;
      --code-text: #e6dac6;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-x: hidden;
      background: var(--paper);
    }
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      padding-bottom: calc(var(--safe-bottom) + 20px);
    }

    /* -------------------------------------------------------------
       App Header (Xiaohongshu Navigation & Top Channels)
       ------------------------------------------------------------- */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(245, 239, 230, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      padding: max(8px, var(--safe-top)) 16px 0;
      width: 100%;
      max-width: 100vw;
      box-sizing: border-box;
      overflow: hidden;
    }

    .header-main-row {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 6px;
      box-sizing: border-box;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .brand-logo {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #b9281e;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12.5px;
      font-family: Georgia, "Songti SC", serif;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(185, 40, 30, 0.22);
    }
    .brand-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .search-capsule {
      flex: 1 1 280px;
      max-width: 440px;
      position: relative;
    }
    .search-capsule input {
      width: 100%;
      height: 32px;
      background: #eae1d1;
      border: 1px solid transparent;
      border-radius: 16px;
      padding: 0 12px 0 32px;
      font-size: 12.5px;
      color: var(--ink);
      outline: none;
      transition: all .15s ease;
    }
    .search-capsule input:focus {
      background: #ffffff;
      border-color: #d6ccbe;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .search-capsule .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      color: #888;
      pointer-events: none;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-top-download {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      background: #eae2d3;
      color: #92887a;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 50%;
      cursor: pointer;
      transition: all .2s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
      box-shadow: none;
    }
    .btn-top-download:not(:disabled) {
      background: #b9281e;
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(185, 40, 30, 0.28);
    }
    .btn-top-download:hover:not(:disabled) {
      background: #9e2017;
      transform: translateY(-1px) scale(1.05);
      box-shadow: 0 4px 12px rgba(185, 40, 30, 0.35);
    }
    .btn-top-download:active:not(:disabled) {
      transform: translateY(0) scale(0.96);
    }
    .btn-top-download:disabled {
      background: #eae2d3;
      color: #a39887;
      border-color: transparent;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.72;
      transform: none;
    }
    .btn-top-download.loading {
      cursor: wait;
    }
    .btn-top-download.loading .btn-download-icon svg {
      animation: spin 1s linear infinite;
    }
    .btn-download-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-download-badge {
      position: absolute;
      top: -3px;
      right: -4px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      background: #231b15;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      line-height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1.5px solid #faf6ee;
      box-sizing: border-box;
      pointer-events: none;
      animation: badgePop .2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes badgePop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Xiaohongshu Top Channel Tabs (Horizontally Scrollable) */
    .xhs-tabs-wrap {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      box-sizing: border-box;
    }
    .xhs-tabs-wrap::-webkit-scrollbar {
      display: none;
    }
    .xhs-tabs-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 2px 0 0;
      white-space: nowrap;
      min-width: max-content;
    }
    .xhs-tab {
      background: transparent;
      border: none;
      padding: 6px 2px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      user-select: none;
      transition: all .15s ease;
    }
    .xhs-tab .tab-text {
      font-size: 14px;
      color: #777777;
      font-weight: 400;
      transition: all .15s ease;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .xhs-tab:hover .tab-text {
      color: var(--ink);
    }
    .xhs-tab.active .tab-text {
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
    }
    .xhs-tab .tab-indicator {
      position: absolute;
      bottom: 0;
      width: 16px;
      height: 2.5px;
      border-radius: 1.5px;
      background: transparent;
      transition: all .2s ease;
    }
    .xhs-tab.active .tab-indicator {
      background: var(--accent);
      width: 20px;
    }
    .xhs-tab .fav-badge {
      font-size: 10px;
      background: rgba(255, 36, 66, 0.12);
      color: var(--accent);
      padding: 1px 5px;
      border-radius: 10px;
      font-weight: 600;
      margin-left: 2px;
    }

    /* -------------------------------------------------------------
       Xiaohongshu Dual-Column Waterfall / Card Feed
       ------------------------------------------------------------- */
    .feed-container {
      max-width: 1200px;
      margin: 10px auto 40px;
      padding: 0 12px;
      overflow-x: hidden;
      touch-action: pan-y;
    }
    .feed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px 10px;
      align-items: start;
      will-change: transform, opacity;
    }

    .feed-card {
      background: var(--paper-card);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform .2s ease, box-shadow .2s ease;
      border: 1px solid var(--line);
      content-visibility: auto;
      contain-intrinsic-size: 200px 320px;
    }
    .feed-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.09);
    }

    /* Natural dynamic image height & progressive skeleton shimmer */
    .feed-card-media {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #ede6d8 linear-gradient(90deg, #ede6d8 0px, #f7f0e5 40px, #ede6d8 80px);
      background-size: 600px;
      animation: cardShimmer 1.8s infinite ease-in-out;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .feed-card-media.has-loaded {
      animation: none;
      background: #ede6d8;
    }
    @keyframes cardShimmer {
      0% { background-position: -300px 0; }
      100% { background-position: 300px 0; }
    }
    .feed-card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity .3s ease, transform .3s ease;
    }
    .feed-card-media img.loaded {
      opacity: 1;
    }
    .feed-card:hover .feed-card-media img {
      transform: scale(1.025);
    }

    .feed-card-info {
      padding: 8px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: #ffffff;
    }
    .feed-card-title {
      font-size: 13.5px;
      font-weight: 500;
      color: #222222;
      line-height: 1.35;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .feed-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 2px;
    }
    .card-author {
      display: flex;
      align-items: center;
      min-width: 0;
      overflow: hidden;
    }
    .author-name {
      font-size: 11px;
      color: #777777;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-like-btn {
      background: transparent;
      border: none;
      padding: 2px 2px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: #777777;
      cursor: pointer;
      transition: transform .15s ease, color .15s ease;
      flex-shrink: 0;
      user-select: none;
    }
    .card-like-btn:hover {
      color: var(--accent);
      transform: scale(1.12);
    }
    .card-like-btn.liked {
      color: var(--accent);
    }
    .card-like-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }
    .card-like-btn.liked svg {
      fill: var(--accent);
      stroke: var(--accent);
    }
    .card-like-btn:active svg {
      transform: scale(0.85);
    }

    /* -------------------------------------------------------------
       Xiaohongshu Note Detail Page Modal / View
       ------------------------------------------------------------- */
    #note-detail-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
    }
    #note-detail-modal.open {
      display: flex;
      animation: noteFadeIn .2s ease;
    }
    @keyframes noteFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .note-window {
      position: relative;
      background: #ffffff;
      width: min(92vw, 660px);
      height: min(92vh, 920px);
      border-radius: 16px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Note Top Bar (Back, Author Avatar, Follow, Share) */
    .note-header {
      flex: 0 0 auto;
      width: 100%;
      min-height: 52px;
      padding: 0 14px;
      background: #ffffff;
      border-bottom: 1px solid #f0ece6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 20;
      box-sizing: border-box;
    }
    .note-btn-back {
      background: transparent;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333333;
      cursor: pointer;
      transition: background .15s;
      flex-shrink: 0;
    }
    .note-btn-back:hover {
      background: #f5f0e8;
    }

    .note-author-info {
      display: flex;
      align-items: center;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      margin-left: 6px;
    }
    .note-author-name {
      font-size: 14.5px;
      font-weight: 600;
      color: #222222;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Scrollable Note Body */
    .note-scroll-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: #ffffff;
      padding-bottom: 24px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }
    .note-scroll-body::-webkit-scrollbar {
      display: none;
    }

    /* Media showcase with Continuous Touch Swiper Track */
    .note-media-wrap {
      width: 100%;
      aspect-ratio: 4 / 5;
      max-height: 65vh;
      background: #f4eee3;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: background 0.28s ease;
      margin: 0 auto;
    }
    .note-swiper-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .note-swiper-wrap:active {
      cursor: grabbing;
    }
    .note-swiper-track {
      width: 100%;
      height: 100%;
      display: flex;
      position: relative;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }
    .swiper-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      will-change: transform;
      cursor: pointer;
    }
    .swiper-slide-prev {
      transform: translate3d(-100%, 0, 0);
    }
    .swiper-slide-curr {
      transform: translate3d(0, 0, 0);
    }
    .swiper-slide-next {
      transform: translate3d(100%, 0, 0);
    }

    .swiper-img {
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      margin: auto;
      pointer-events: none;
    }

    /* Immersive Mode (Fullscreen Hide UI) */
    #note-detail-modal.immersive-mode {
      background: #000000;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    #note-detail-modal.immersive-mode .note-window {
      background: #000000;
      box-shadow: none;
      border-radius: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 100vw;
      max-height: 100dvh;
      transition: background .28s ease;
    }
    #note-detail-modal.immersive-mode .note-header {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.28s ease, opacity 0.28s ease;
    }
    #note-detail-modal.immersive-mode .note-bottom-bar {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.28s ease, opacity 0.28s ease;
    }
    #note-detail-modal.immersive-mode .note-content-container {
      opacity: 0;
      max-height: 0;
      padding: 0;
      margin: 0;
      pointer-events: none;
      overflow: hidden;
      transition: opacity 0.28s ease, max-height 0.28s ease;
    }
    #note-detail-modal.immersive-mode .note-scroll-body {
      background: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      padding-bottom: 0;
      overflow: hidden;
    }
    #note-detail-modal.immersive-mode .note-media-wrap {
      flex: 1 1 100%;
      height: 100%;
      min-height: 100%;
      aspect-ratio: auto;
      max-height: 100vh;
      background: #000000;
    }
    #note-detail-modal.immersive-mode .note-swiper-wrap {
      min-height: 100%;
      height: 100%;
    }
    #note-detail-modal.immersive-mode .swiper-img {
      max-height: 90vh;
      max-height: 90dvh;
      max-width: 96vw;
    }
    #note-detail-modal.immersive-mode .note-nav-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }
    #note-detail-modal.immersive-mode .note-nav-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    /* Text & Note Content */
    .note-content-container {
      padding: 16px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .note-title {
      font-size: 18px;
      font-weight: 600;
      color: #222222;
      line-height: 1.35;
      margin: 0;
    }

    .note-text-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 14.5px;
      line-height: 1.6;
      color: #333333;
    }
    .note-desc {
      margin: 0;
      color: #444444;
    }

    /* Prompt section inside Note (Pure Text, No extra border) */
    .note-prompt-section {
      margin-top: 6px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .prompt-section-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .prompt-title-tag {
      font-size: 13.5px;
      font-weight: 600;
      color: #333333;
    }
    .btn-copy-inline-prompt {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f0ece3;
      color: #444444;
      border: 1px solid #dfd5c4;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      cursor: pointer;
      transition: all .15s ease;
    }
    .btn-copy-inline-prompt:hover {
      background: var(--ink);
      color: #ffffff;
      border-color: var(--ink);
    }
    .prompt-full-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      line-height: 1.65;
      color: #555555;
      background: transparent;
      border: none;
      padding: 2px 0 0;
      white-space: pre-wrap;
      word-break: break-word;
      cursor: pointer;
    }
    .prompt-full-text:hover {
      color: #111111;
    }

    /* Bottom Fixed Action Bar (Icon-only) */
    .note-bottom-bar {
      flex: 0 0 auto;
      width: 100%;
      min-height: 52px;
      padding: 8px 16px;
      background: #ffffff;
      border-top: 1px solid #f0ece6;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 20;
      box-sizing: border-box;
      position: relative;
    }

    .note-bottom-action {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #f7f4ee;
      border: 1px solid #ede5d8;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333333;
      cursor: pointer;
      transition: all .15s ease;
      flex-shrink: 0;
    }
    .note-bottom-action:hover {
      background: #eee6d8;
      color: #111111;
      transform: translateY(-1px);
    }
    .note-bottom-action:active {
      transform: scale(0.92);
    }
    .note-bottom-action svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      stroke: currentColor;
    }
    .note-bottom-action.liked {
      background: #fff0f2;
      border-color: #ffcdd4;
      color: var(--accent);
    }
    .note-bottom-action.liked svg {
      fill: var(--accent);
      stroke: var(--accent);
    }

    /* Prev & Next Floating Arrow Buttons */
    .note-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.1);
      color: #222222;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      z-index: 30;
      user-select: none;
    }
    .note-nav-btn:hover {
      background: #ffffff;
      transform: translateY(-50%) scale(1.08);
      color: var(--accent);
    }
    .note-nav-prev { left: -60px; }
    .note-nav-next { right: -60px; }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: max(30px, var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: rgba(20, 18, 16, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #faf5eb;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: all .25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 3000;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Empty state */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 15px;
    }
    .empty-favorites {
      background: var(--paper-card);
      border: 1px dashed var(--line-dark);
      border-radius: 12px;
      padding: 50px 20px;
      max-width: 480px;
      margin: 40px auto;
    }
    .empty-favorites .empty-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }
    .empty-favorites h3 {
      font-size: 17px;
      color: var(--ink);
      margin: 0 0 8px;
      font-weight: 600;
    }
    .empty-favorites p {
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--muted);
      margin: 0 0 18px;
    }
    .btn-goto-gallery {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 18px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(255, 36, 66, 0.3);
    }

    /* -------------------------------------------------------------
       Share Card Poster Modal (文创艺术分享卡片)
       ------------------------------------------------------------- */
    #share-card-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px 12px;
      box-sizing: border-box;
      overflow-y: auto;
    }
    #share-card-modal.open {
      display: flex;
    }

    .share-modal-container {
      position: relative;
      max-width: 330px;
      width: 90vw;
      max-height: 92vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
      box-sizing: border-box;
      margin: auto;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    }

    .share-modal-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      padding: 0 4px;
      box-sizing: border-box;
    }
    .share-modal-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .share-modal-close {
      background: rgba(255,255,255,0.2);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      cursor: pointer;
      transition: background .15s ease;
      flex-shrink: 0;
    }
    .share-modal-close:hover {
      background: rgba(255,255,255,0.35);
    }

    .share-card-scroll-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 2px 0;
      box-sizing: border-box;
    }

    /* Physical Art Card Paper Aesthetic */
    .share-card-paper {
      width: 100%;
      background: #fbf8f2;
      border-radius: 14px;
      padding: 12px 12px 10px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
      border: 1px solid #e5dbcb;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-sizing: border-box;
      position: relative;
    }

    .share-card-header {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 2px 0 4px;
      box-sizing: border-box;
    }
    .share-card-series {
      font-size: 12px;
      font-weight: 600;
      color: #666666;
      letter-spacing: 0.8px;
    }

    /* Artwork image frame: fills width, zero letterboxing/side gutters, adaptive height */
    .share-card-art-box {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      display: block;
      position: relative;
      box-sizing: border-box;
      line-height: 0;
    }
    .share-card-art-box img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .share-card-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
      box-sizing: border-box;
      padding: 2px 0;
    }
    .share-card-title {
      font-size: 14px;
      font-weight: 600;
      color: #222222;
      margin: 0;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .share-card-features {
      font-size: 11px;
      color: #666666;
      margin: 0;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Card Footer & QR Code */
    .share-card-footer {
      border-top: 1px dashed #dcd1c0;
      padding-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-sizing: border-box;
    }
    .share-footer-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }
    .share-qr-title {
      font-size: 11px;
      font-weight: 600;
      color: #222222;
      white-space: nowrap;
    }
    .share-qr-desc {
      font-size: 9.5px;
      color: #777777;
      white-space: nowrap;
    }
    .share-qr-right {
      flex-shrink: 0;
      background: #ffffff;
      padding: 3px;
      border-radius: 6px;
      border: 1px solid #e5ddcf;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .share-qr-right canvas {
      display: block;
      width: 46px;
      height: 46px;
    }

    /* Bottom Action Buttons */
    .share-modal-actions {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-sizing: border-box;
    }
    .btn-share-save {
      flex: 1 1 auto;
      background: linear-gradient(135deg, #ff2442, #e01b37);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 4px 12px rgba(255, 36, 66, 0.35);
      transition: all .15s ease;
      white-space: nowrap;
    }
    .btn-share-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(255, 36, 66, 0.45);
    }
    .btn-share-save:active {
      transform: translateY(0);
    }
    .btn-share-link {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 20px;
      padding: 8px 12px;
      font-size: 11.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      backdrop-filter: blur(4px);
      transition: all .15s ease;
      white-space: nowrap;
    }
    .btn-share-link:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* -------------------------------------------------------------
       Mobile Responsive Specifications (<680px)
       ------------------------------------------------------------- */
    @media (max-width: 680px) {
      .app-header {
        padding: max(13px, calc(var(--safe-top) + 8px)) 12px 0;
      }
      .brand-title {
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      @media (max-width: 360px) {
        .brand-title {
          display: none;
        }
      }
      .header-main-row {
        gap: 8px;
        padding-bottom: 9px;
      }
      .search-capsule {
        flex: 1 1 auto;
        max-width: none;
      }
      .search-capsule input {
        height: 33px;
        font-size: 12.5px;
      }
      .btn-top-download {
        width: 32px;
        height: 32px;
        padding: 0;
      }
      .xhs-tabs-nav {
        gap: 16px;
        padding: 2px 2px 6px;
      }
      .xhs-tab .tab-text {
        font-size: 14px;
      }
      .xhs-tab.active .tab-text {
        font-size: 15px;
      }

      /* Fixed 2-column mobile feed with comfortable breathing room */
      .feed-container {
        padding: 0 10px;
        margin-top: 13px;
      }
      .feed-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .feed-card {
        border-radius: 10px;
      }
      .feed-card-info {
        padding: 6px 8px 8px;
        gap: 4px;
      }
      .feed-card-title {
        font-size: 13px;
        line-height: 1.32;
      }
      .author-name {
        font-size: 10.5px;
      }

      /* Mobile Note Detail Page Fullscreen overlay */
      #note-detail-modal {
        background: #ffffff;
        padding: 0;
        align-items: stretch;
        justify-content: flex-start;
        width: 100%;
        max-width: 100vw;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
      }
      .note-window {
        max-width: 100%;
        width: 100%;
        min-width: 0;
        height: 100%;
        height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
        box-sizing: border-box;
      }
      .note-nav-btn {
        display: none; /* Swipe gesture instead */
      }
      .note-header {
        padding: max(10px, var(--safe-top)) 12px 10px;
        min-height: calc(48px + var(--safe-top));
        height: auto;
        gap: 6px;
      }
      .note-bottom-bar {
        padding: 8px 16px max(12px, var(--safe-bottom));
        height: auto;
        min-height: calc(52px + var(--safe-bottom));
        gap: 28px;
      }
      .note-bottom-action {
        width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 50%;
      }
      .note-bottom-action svg {
        width: 22px;
        height: 22px;
      }
      .note-scroll-body {
        padding-bottom: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Xiaohongshu Top Header Navigation -->
  <header class="app-header">
    <div class="header-main-row">
      <div class="brand-area">
        <span class="brand-logo">印</span>
        <span class="brand-title">rubber world</span>
      </div>

      <!-- Search Capsule -->
      <div class="search-capsule">
        <span class="search-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
        <input type="text" id="search-input" placeholder="搜索" autocomplete="off">
      </div>

      <!-- Right Tools: Batch Download -->
      <div class="header-tools">
        <button class="btn-top-download" id="btn-batch-download" onclick="downloadLikedStamps()" title="批量下载（点赞印章后可下载）" aria-label="批量下载" disabled>
          <span class="btn-download-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          </span>
          <span class="btn-download-badge" id="batch-download-count" style="display: none;">0</span>
        </button>
      </div>
    </div>

    <!-- Xiaohongshu Scrollable Channel Tabs -->
    <div class="xhs-tabs-wrap">
      <nav class="xhs-tabs-nav" id="series-nav">
        <button class="xhs-tab active" data-series="all">
          <span class="tab-text">全部</span>
          <span class="tab-indicator"></span>
        </button>
        <button class="xhs-tab" data-series="scenic_spots">
          <span class="tab-text">名胜风景</span>
          <span class="tab-indicator"></span>
        </button>
        <button class="xhs-tab" data-series="poetry">
          <span class="tab-text">古诗名句</span>
          <span class="tab-indicator"></span>
        </button>
        <button class="xhs-tab" data-series="cities">
          <span class="tab-text">世界城市</span>
          <span class="tab-indicator"></span>
        </button>
        <button class="xhs-tab" data-series="games">
          <span class="tab-text">游戏神作</span>
          <span class="tab-indicator"></span>
        </button>
        <button class="xhs-tab" data-series="wildlife">
          <span class="tab-text">珍稀动物</span>
          <span class="tab-indicator"></span>
        </button>
        <button class="xhs-tab" data-series="marine">
          <span class="tab-text">海洋生物</span>
          <span class="tab-indicator"></span>
        </button>
        <button class="xhs-tab" data-series="atmosphere">
          <span class="tab-text">大气现象</span>
          <span class="tab-indicator"></span>
        </button>
        <button class="xhs-tab" data-series="zodiac">
          <span class="tab-text">十二生肖</span>
          <span class="tab-indicator"></span>
        </button>
        <button class="xhs-tab" data-series="solar_terms">
          <span class="tab-text">二十四节气</span>
          <span class="tab-indicator"></span>
        </button>
        <button class="xhs-tab" data-series="shanhaijing">
          <span class="tab-text">山海神异</span>
          <span class="tab-indicator"></span>
        </button>
        <button class="xhs-tab" data-series="favorites">
          <span class="tab-text">我的点赞 <span class="fav-badge" id="fav-tab-badge">0</span></span>
          <span class="tab-indicator"></span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Feed Waterfall Container -->
  <main class="feed-container">
    <div class="feed-grid" id="grid"></div>
    <div id="feed-sentinel" style="height: 20px; margin-top: 10px; visibility: hidden;"></div>
  </main>

  <!-- Xiaohongshu Note Detail Page Modal -->
  <div id="note-detail-modal" aria-modal="true" role="dialog">
    <div class="note-window" id="note-window">
      <!-- Top Navigation Bar -->
      <div class="note-header">
        <button class="note-btn-back" id="btn-note-back" onclick="closeNoteDetail()" title="返回列表">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>

        <div class="note-author-info">
          <div class="note-author-name" id="note-author-name">名胜风景 · 第 01 枚</div>
        </div>
      </div>

      <!-- Desktop Nav Arrows -->
      <button class="note-nav-btn note-nav-prev" id="btn-note-prev" onclick="navNote(-1)" title="上一张 (←)">‹</button>
      <button class="note-nav-btn note-nav-next" id="btn-note-next" onclick="navNote(1)" title="下一张 (→)">›</button>

      <!-- Scrollable Note Body -->
      <div class="note-scroll-body" id="note-scroll-body">
        <!-- Swiper Media Container with Continuous Touch Translation -->
        <div class="note-media-wrap">
          <div class="note-swiper-wrap" id="note-swiper-wrap" title="点击切换全屏 / 左右滑动切换">
            <div class="note-swiper-track" id="note-swiper-track">
              <!-- Prev Slide Slot -->
              <div class="swiper-slide swiper-slide-prev" id="slide-prev">
                <img class="swiper-img" id="img-prev" src="" alt="上一张印章">
              </div>
              <!-- Current Active Slide Slot -->
              <div class="swiper-slide swiper-slide-curr" id="slide-curr">
                <img class="swiper-img" id="note-main-img" src="" alt="当前印章作品">
              </div>
              <!-- Next Slide Slot -->
              <div class="swiper-slide swiper-slide-next" id="slide-next">
                <img class="swiper-img" id="img-next" src="" alt="下一张印章">
              </div>
            </div>
          </div>
        </div>

        <!-- Note Text Body -->
        <div class="note-content-container">
          <h1 class="note-title" id="note-title">北京故宫 · 太和红墙</h1>

          <div class="note-text-body">
            <p class="note-desc" id="note-desc">太和殿重檐庑殿顶、红墙金瓦、汉白玉雕栏。</p>

            <!-- Inline Xiaohongshu Prompt Block -->
            <div class="note-prompt-section">
              <div class="prompt-section-header">
                <span class="prompt-title-tag">提示词</span>
                <button class="btn-copy-inline-prompt" onclick="copyCurrentPrompt()" title="点击复制 Prompt">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                  <span>复制</span>
                </button>
              </div>
              <div class="prompt-full-text" id="note-prompt-text" onclick="copyCurrentPrompt()" title="点击一键复制作图 Prompt"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Fixed Action Bar -->
      <div class="note-bottom-bar">
        <!-- Like Button -->
        <button class="note-bottom-action" id="btn-note-like" onclick="toggleNoteLike()" title="点赞">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        </button>

        <!-- Download Single PNG Button -->
        <button class="note-bottom-action" id="btn-note-download" onclick="downloadCurrentNote()" title="下载高清原图">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </button>

        <!-- Share Button -->
        <button class="note-bottom-action" id="btn-note-share" onclick="shareCurrentNote()" title="生成分享海报">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Share Card Modal (文创艺术分享海报) -->
  <div id="share-card-modal" class="share-modal" aria-modal="true" role="dialog">
    <div class="share-modal-container">
      <!-- Top Close / Title bar -->
      <div class="share-modal-header">
        <span class="share-modal-title">分享印章卡片</span>
        <button class="share-modal-close" onclick="closeShareCard()" title="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <!-- Scrollable Preview Wrapper -->
      <div class="share-card-scroll-wrap">
        <!-- Physical Card DOM Preview -->
        <div class="share-card-paper" id="share-card-paper">
          <!-- Card Top Series Tag -->
          <div class="share-card-header">
            <span class="share-card-series" id="share-card-series-tag">名胜风景系列</span>
          </div>

          <!-- Card Artwork Frame -->
          <div class="share-card-art-box">
            <img id="share-card-img" class="share-card-img" src="" alt="印章作品">
          </div>

          <!-- Card Info & Description -->
          <div class="share-card-meta">
            <h2 class="share-card-title" id="share-card-title">北京故宫 · 太和红墙</h2>
            <p class="share-card-features" id="share-card-features">太和殿重檐庑殿顶、红墙金瓦、汉白玉雕栏</p>
          </div>

          <!-- Card Footer with QR Code -->
          <div class="share-card-footer">
            <div class="share-footer-left">
              <div class="share-qr-title">长按识别二维码</div>
              <div class="share-qr-desc">鉴赏与获取 Prompt</div>
            </div>
            <div class="share-qr-right">
              <canvas id="share-card-qr" width="46" height="46"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Buttons (Save Poster & Copy Link) -->
      <div class="share-modal-actions">
        <button class="btn-share-save" id="btn-share-save-poster" onclick="downloadShareCardPoster()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span>保存分享海报 (PNG)</span>
        </button>
        <button class="btn-share-link" onclick="copyShareCardLink()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
          <span>复制链接</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast">已复制作图 Prompt 到剪贴板</div>

  <!-- Scripts: Dependencies & Data -->
  <script src="jszip.min.js"></script>
  <script src="data.js"></script>

  <script>
    /* -------------------------------------------------------------
       App State & Initialization
       ------------------------------------------------------------- */
    let currentSeriesKey = "all";
    let currentFilteredRows = [];
    let currentModalIndex = 0;
    const LIKES_STORAGE_KEY = "rubber_stamp_likes_v1";

    const seriesTabs = document.querySelectorAll(".xhs-tab");
    const searchInput = document.querySelector("#search-input");
    const gridEl = document.querySelector("#grid");
    const toastEl = document.querySelector("#toast");
    const favTabBadge = document.querySelector("#fav-tab-badge");
    const batchDownloadCount = document.querySelector("#batch-download-count");
    const btnBatchDownload = document.querySelector("#btn-batch-download");

    // Note Detail Modal elements
    const noteModal = document.querySelector("#note-detail-modal");
    const noteWindow = document.querySelector("#note-window");
    const noteScrollBody = document.querySelector("#note-scroll-body");
    const noteSwiperWrap = document.querySelector("#note-swiper-wrap");
    const noteSwiperTrack = document.querySelector("#note-swiper-track");
    const slidePrev = document.querySelector("#slide-prev");
    const slideCurr = document.querySelector("#slide-curr");
    const slideNext = document.querySelector("#slide-next");
    const imgPrev = document.querySelector("#img-prev");
    const noteMainImg = document.querySelector("#note-main-img");
    const imgNext = document.querySelector("#img-next");
    const noteAuthorName = document.querySelector("#note-author-name");
    const noteTitle = document.querySelector("#note-title");
    const noteDesc = document.querySelector("#note-desc");
    const notePromptText = document.querySelector("#note-prompt-text");
    const btnNoteLike = document.querySelector("#btn-note-like");

    // Share Card Modal elements
    const shareModal = document.querySelector("#share-card-modal");
    const shareCardPaper = document.querySelector("#share-card-paper");
    const shareCardSeriesTag = document.querySelector("#share-card-series-tag");
    const shareCardImg = document.querySelector("#share-card-img");
    const shareCardTitle = document.querySelector("#share-card-title");
    const shareCardFeatures = document.querySelector("#share-card-features");
    const shareCardQrCanvas = document.querySelector("#share-card-qr");
    const btnShareSavePoster = document.querySelector("#btn-share-save-poster");

    let currentShareItem = null;
    let currentHiresToken = 0;

    /* -------------------------------------------------------------
       On-Demand Dynamic Script Loader (Reduces Initial JS Payload)
       ------------------------------------------------------------- */
    const loadedScriptsMap = new Map();
    function loadScriptOnce(src) {
      if (loadedScriptsMap.has(src)) return loadedScriptsMap.get(src);
      const p = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error("Failed to load script: " + src));
        document.head.appendChild(s);
      });
      loadedScriptsMap.set(src, p);
      return p;
    }

    /* -------------------------------------------------------------
       Image Thumbnail Helper (98.8% Size Optimization)
       ------------------------------------------------------------- */
    function getThumbnailUrl(origPath) {
      if (!origPath) return "placeholder.svg";
      return origPath.replace(/^images\//, "images/thumbnails/").replace(/\.png$/i, ".webp");
    }

    function getDetailWebpUrl(origPath) {
      if (!origPath) return "placeholder.svg";
      return origPath.replace(/^images\//, "images/detail_webp/").replace(/\.png$/i, ".webp");
    }

    /* -------------------------------------------------------------
       Likes & Favorites System (LocalStorage)
       ------------------------------------------------------------- */
    function getLikedSet() {
      try {
        const raw = localStorage.getItem(LIKES_STORAGE_KEY);
        return new Set(raw ? JSON.parse(raw) : []);
      } catch (e) {
        return new Set();
      }
    }

    function saveLikedSet(set) {
      try {
        localStorage.setItem(LIKES_STORAGE_KEY, JSON.stringify([...set]));
      } catch (e) {
        console.warn("Could not save favorites to localStorage", e);
      }
    }

    function isLiked(output) {
      return getLikedSet().has(output);
    }

    function getAllLikedItems() {
      const set = getLikedSet();
      const allLiked = [];
      const seriesOrder = ["scenic_spots", "poetry", "cities", "games", "wildlife", "marine", "atmosphere", "zodiac", "solar_terms", "shanhaijing"];
      seriesOrder.forEach(sKey => {
        const col = window.COLLECTIONS[sKey];
        if (col && col.items) {
          col.items.forEach(item => {
            if (set.has(item.output)) {
              allLiked.push({
                ...item,
                seriesKey: sKey,
                seriesTitle: col.title,
                seriesTitleEn: col.titleEn
              });
            }
          });
        }
      });
      return allLiked;
    }

    function toggleLike(item) {
      if (!item || !item.output) return false;
      const set = getLikedSet();
      const liked = set.has(item.output);
      const name = item.city || item.title || item.name || "作品";

      if (liked) {
        set.delete(item.output);
        saveLikedSet(set);
        showToast(`已取消对「${name}」的点赞`);
      } else {
        set.add(item.output);
        saveLikedSet(set);
        showToast(`已点赞「${name}」`);
      }

      updateLikesUI();
      return !liked;
    }

    function handleCardLike(output) {
      const col = getCollection();
      const item = col.items.find(x => x.output === output) || getAllLikedItems().find(x => x.output === output);
      if (item) toggleLike(item);
    }

    function updateLikesUI() {
      const set = getLikedSet();
      const count = set.size;

      if (favTabBadge) favTabBadge.textContent = count;
      if (batchDownloadCount) {
        batchDownloadCount.textContent = count;
        batchDownloadCount.style.display = count > 0 ? "inline-flex" : "none";
      }
      if (btnBatchDownload) {
        btnBatchDownload.disabled = count === 0;
        btnBatchDownload.title = count > 0 
          ? `批量下载已点赞的 ${count} 张高清原图` 
          : "批量下载（点赞印章后可下载）";
        btnBatchDownload.setAttribute("aria-label", btnBatchDownload.title);
      }

      // Update like buttons in current grid
      document.querySelectorAll(".card-like-btn").forEach(btn => {
        const out = btn.dataset.output;
        const isL = set.has(out);
        btn.classList.toggle("liked", isL);
        btn.title = isL ? "取消点赞" : "点赞";
        btn.innerHTML = getHeartSvg(isL);
      });

      // If currently viewing favorites series tab, re-render
      if (currentSeriesKey === "favorites") {
        render();
      }

      // If detail modal is open, sync modal like button
      if (noteModal.classList.contains("open") && currentFilteredRows[currentModalIndex]) {
        const curItem = currentFilteredRows[currentModalIndex];
        const isL = set.has(curItem.output);
        syncNoteLikeUI(isL);
      }
    }

    function getHeartSvg(filled) {
      return filled
        ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="#ff2442" stroke="#ff2442" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`
        : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;
    }

    function syncNoteLikeUI(isL) {
      if (btnNoteLike) {
        btnNoteLike.classList.toggle("liked", isL);
        btnNoteLike.title = isL ? "取消点赞" : "点赞";
      }
    }

    /* -------------------------------------------------------------
       Batch & Single Download (JSZip Client-Side Packaging)
       ------------------------------------------------------------- */
    async function downloadLikedStamps() {
      const likedItems = getAllLikedItems();
      if (likedItems.length === 0) {
        showToast("您还没有点赞任何印章作品，请先点赞！");
        return;
      }

      btnBatchDownload.disabled = true;
      btnBatchDownload.classList.add("loading");

      try {
        showToast("正在准备打包组件...");
        if (typeof JSZip === "undefined") {
          await loadScriptOnce("jszip.min.js");
        }
        showToast(`准备打包 ${likedItems.length} 张高清原图...`);
        const zip = new JSZip();
        const folder = zip.folder("rubber-stamps-favorites");

        for (let i = 0; i < likedItems.length; i++) {
          const item = likedItems[i];
          showToast(`正在打包 (${i + 1}/${likedItems.length})...`);

          const response = await fetch(item.output);
          if (!response.ok) throw new Error(`无法获取图片: ${item.output}`);
          const blob = await response.blob();

          const cleanTitle = (item.title || item.city || item.name || `stamp_${item.id}`).replace(/[\/:*?"<>|]/g, "_");
          const filename = `${item.seriesTitle || "印章"}_${String(item.id).padStart(2, "0")}_${cleanTitle}.png`;
          folder.file(filename, blob);
        }

        showToast("正在压缩原图合集，请稍候...");
        const zipBlob = await zip.generateAsync({
          type: "blob",
          compression: "DEFLATE",
          compressionOptions: { level: 6 }
        });

        const downloadUrl = URL.createObjectURL(zipBlob);
        const a = document.createElement("a");
        a.href = downloadUrl;
        a.download = `rubber-stamps-favorites-${likedItems.length}枚.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

        showToast(`成功打包下载 ${likedItems.length} 张高清原图！`);
      } catch (err) {
        console.error("Batch download error:", err);
        showToast("下载遇到问题，请检查网络后重试");
      } finally {
        btnBatchDownload.classList.remove("loading");
        updateLikesUI();
      }
    }

    async function downloadSingleStamp(item) {
      if (!item || !item.output) return;
      try {
        const cleanTitle = (item.title || item.city || item.name || `stamp_${item.id}`).replace(/[\/:*?"<>|]/g, "_");
        showToast(`正在下载「${cleanTitle}」原图...`);
        const res = await fetch(item.output);
        if (!res.ok) throw new Error("Fetch failed");
        const blob = await res.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${cleanTitle}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
        showToast(`已保存「${cleanTitle}」高清原图`);
      } catch (e) {
        showToast("下载失败，请稍后重试");
      }
    }

    /* -------------------------------------------------------------
       Collection Resolver
       ------------------------------------------------------------- */
    function getCollection() {
      if (currentSeriesKey === "all") {
        const order = ["scenic_spots", "poetry", "cities", "games", "wildlife", "marine", "atmosphere", "zodiac", "solar_terms", "shanhaijing"];
        const allItems = [];
        order.forEach(k => {
          const col = window.COLLECTIONS[k];
          if (col && col.items) {
            col.items.forEach(it => {
              allItems.push({
                ...it,
                seriesKey: k,
                seriesTitle: it.seriesTitle || col.title || col.name
              });
            });
          }
        });
        return {
          id: "all",
          title: "全部",
          titleEn: "All",
          count: allItems.length,
          items: allItems
        };
      }
      if (currentSeriesKey === "favorites") {
        const likedItems = getAllLikedItems();
        return {
          id: "favorites",
          title: "我的点赞",
          titleEn: "My Favorites",
          count: likedItems.length,
          items: likedItems
        };
      }
      return window.COLLECTIONS[currentSeriesKey] || window.COLLECTIONS.scenic_spots;
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 2000);
    }

    function copyText(text, successMsg = "已复制作图 Prompt 到剪贴板") {
      if (!text) {
        showToast("暂无可复制的 Prompt");
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(successMsg)).catch(() => {
          fallbackCopy(text, successMsg);
        });
      } else {
        fallbackCopy(text, successMsg);
      }
    }

    function fallbackCopy(text, successMsg) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast(successMsg);
      } catch (e) {
        showToast("复制失败，请手动选取");
      }
      document.body.removeChild(ta);
    }

    /* -------------------------------------------------------------
       Gallery Feed Render (Progressive Chunked Stream + Eager LCP)
       ------------------------------------------------------------- */
    const FEED_CHUNK_SIZE = 12;
    let feedRenderedCount = 0;
    let feedSentinelObserver = null;
    const feedSentinel = document.querySelector("#feed-sentinel");

    function renderCardHtml(x, idx, col) {
      const displayName = x.city || x.title || x.name;
      const liked = isLiked(x.output);
      const seriesName = x.seriesTitle || col.title || "橡胶戳";
      const tagText = x.region || x.season || x.category || x.province || x.author || seriesName;
      const thumbUrl = getThumbnailUrl(x.output);
      const isLcpCandidate = idx < 4;

      return `
        <article class="feed-card" data-index="${idx}" onclick="openNoteDetail(${idx})">
          <div class="feed-card-media">
            <img class="stamp-img"
                 src="${thumbUrl}"
                 alt="${displayName}"
                 width="400"
                 height="500"
                 loading="${isLcpCandidate ? "eager" : "lazy"}"
                 ${isLcpCandidate ? 'fetchpriority="high"' : 'decoding="async"'}
                 onload="this.classList.add('loaded'); this.closest('.feed-card-media').classList.add('has-loaded');"
                 onerror="if(this.src!=='${x.output}'){this.src='${x.output}';}else{this.src='placeholder.svg';}">
          </div>
          <div class="feed-card-info">
            <h2 class="feed-card-title">${displayName}</h2>
            <div class="feed-card-footer">
              <div class="card-author">
                <span class="author-name">${tagText}</span>
              </div>
              <button class="card-like-btn ${liked ? "liked" : ""}" data-output="${x.output}" onclick="event.stopPropagation(); handleCardLike('${x.output}')" title="${liked ? "取消点赞" : "点赞"}">
                ${getHeartSvg(liked)}
              </button>
            </div>
          </div>
        </article>
      `;
    }

    function appendNextFeedChunk() {
      if (feedRenderedCount >= currentFilteredRows.length) {
        if (feedSentinel) feedSentinel.style.display = "none";
        return;
      }
      const col = getCollection();
      const nextBatch = currentFilteredRows.slice(feedRenderedCount, feedRenderedCount + FEED_CHUNK_SIZE);
      const htmlChunk = nextBatch.map((x, i) => renderCardHtml(x, feedRenderedCount + i, col)).join("");
      gridEl.insertAdjacentHTML("beforeend", htmlChunk);
      feedRenderedCount += nextBatch.length;

      if (feedSentinel) {
        feedSentinel.style.display = feedRenderedCount < currentFilteredRows.length ? "block" : "none";
      }
    }

    function setupFeedSentinelObserver() {
      if (feedSentinelObserver) {
        feedSentinelObserver.disconnect();
      }
      if (!feedSentinel || !("IntersectionObserver" in window)) return;
      feedSentinelObserver = new IntersectionObserver((entries) => {
        if (entries[0] && entries[0].isIntersecting) {
          appendNextFeedChunk();
        }
      }, {
        rootMargin: "300px 0px"
      });
      feedSentinelObserver.observe(feedSentinel);
    }

    function render() {
      const col = getCollection();
      const q = searchInput.value.trim().toLowerCase();

      currentFilteredRows = col.items.filter(x => {
        const titleStr = (x.city || x.title || x.name || "") + " " + (x.animal || "") + " " + (x.season || "") + " " + (x.region || "") + " " + (x.province || "") + " " + (x.author || "") + " " + (x.work || "") + " " + (x.category || "") + " " + (x.seriesTitle || "");
        const textToMatch = (titleStr + " " + (x.features || "") + " " + (x.keywords || []).join(" ") + " " + (x.colors || "")).toLowerCase();
        return !q || textToMatch.includes(q);
      });

      if (!currentFilteredRows.length) {
        if (feedSentinel) feedSentinel.style.display = "none";
        if (currentSeriesKey === "favorites") {
          gridEl.innerHTML = `
            <div class="empty empty-favorites">
              <div class="empty-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></div>
              <h3>暂无已点赞的印章作品</h3>
              <p>在画廊中浏览喜欢的印章作品时，点击点赞收藏至此处，即可一键批量打包下载！</p>
              <button class="btn-goto-gallery" onclick="switchSeries('all')">去浏览印章画廊</button>
            </div>
          `;
        } else {
          gridEl.innerHTML = '<div class="empty">没有找到符合条件的印章作品。</div>';
        }
        return;
      }

      // Reset and render initial chunk
      gridEl.innerHTML = "";
      feedRenderedCount = 0;
      appendNextFeedChunk();

      // Observe scroll sentinel
      setupFeedSentinelObserver();
    }

    function switchSeries(key) {
      if (currentSeriesKey === key && currentFilteredRows.length > 0) return;
      currentSeriesKey = key;

      seriesTabs.forEach(t => {
        const isAct = t.dataset.series === key;
        t.classList.toggle("active", isAct);
        if (isAct) {
          t.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
        }
      });

      window.location.hash = key;
      searchInput.value = "";
      render();
    }

    seriesTabs.forEach(t => {
      t.addEventListener("click", () => switchSeries(t.dataset.series));
    });

    let searchDebounceTimer = null;
    searchInput.oninput = () => {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(render, 100);
    };

    /* -------------------------------------------------------------
       Xiaohongshu Note Detail Swiper & Immersive Engine
       ------------------------------------------------------------- */
    let isImmersive = false;
    let isSwiperDragging = false;
    let swiperStartX = 0;
    let swiperStartY = 0;
    let swiperCurrentX = 0;
    let swiperDeltaX = 0;
    let swiperDeltaY = 0;
    let isHorizontalSwipe = null;
    let isAnimatingSlide = false;
    let animatingDirection = 0;
    let slideAnimationTimer = null;

    function toggleImmersiveMode(forceState) {
      if (typeof forceState === "boolean") {
        isImmersive = forceState;
      } else {
        isImmersive = !isImmersive;
      }

      noteModal.classList.toggle("immersive-mode", isImmersive);

    }

    /* -------------------------------------------------------------
       Intelligent Detail Image Preloader (Lookahead Buffer Pipeline)
       ------------------------------------------------------------- */
    const preloadedDetailUrls = new Set();
    let detailPreloadTimer = null;

    function preloadAdjacentDetails(centerIndex) {
      clearTimeout(detailPreloadTimer);
      if (!currentFilteredRows || currentFilteredRows.length <= 1) return;

      // Small debounce (60ms) so rapid continuous swipes settle before queuing requests
      detailPreloadTimer = setTimeout(() => {
        const len = currentFilteredRows.length;
        // High-probability browse path: next 1, 2, 3, 4 slides, and previous 1 slide
        const targetOffsets = [1, 2, 3, 4, -1];

        targetOffsets.forEach((offset, idx) => {
          const targetIdx = (centerIndex + offset + len) % len;
          const targetItem = currentFilteredRows[targetIdx];
          if (!targetItem || !targetItem.output) return;

          const detailUrl = getDetailWebpUrl(targetItem.output);
          if (preloadedDetailUrls.has(detailUrl)) return;

          preloadedDetailUrls.add(detailUrl);

          // Stagger slightly (40ms interval) to prioritize current slide network activity
          setTimeout(() => {
            const preloader = new Image();
            if ("fetchPriority" in preloader) {
              preloader.fetchPriority = "low";
            }
            preloader.src = detailUrl;
            if (preloader.decode) {
              preloader.decode().then(() => {
                // If slide is directly adjacent on track, promote to high-res immediately
                if (offset === 1 && imgNext && currentFilteredRows[(centerIndex + 1) % len] === targetItem) {
                  imgNext.src = detailUrl;
                } else if (offset === -1 && imgPrev && currentFilteredRows[(centerIndex - 1 + len) % len] === targetItem) {
                  imgPrev.src = detailUrl;
                }
              }).catch(() => {});
            }
          }, idx * 40);
        });
      }, 60);
    }

    function populateSwiperSlides(centerIndex) {
      if (!currentFilteredRows || currentFilteredRows.length === 0) return;
      const len = currentFilteredRows.length;
      const prevIdx = (centerIndex - 1 + len) % len;
      const nextIdx = (centerIndex + 1) % len;
      const prev = currentFilteredRows[prevIdx];
      const next = currentFilteredRows[nextIdx];

      if (imgPrev && prev) {
        const prevDetail = getDetailWebpUrl(prev.output);
        imgPrev.src = preloadedDetailUrls.has(prevDetail) ? prevDetail : getThumbnailUrl(prev.output);
        imgPrev.alt = prev.city || prev.title || prev.name || "上一张";
      }

      if (imgNext && next) {
        const nextDetail = getDetailWebpUrl(next.output);
        imgNext.src = preloadedDetailUrls.has(nextDetail) ? nextDetail : getThumbnailUrl(next.output);
        imgNext.alt = next.city || next.title || next.name || "下一张";
      }

      // Preload adjacent lightweight thumbnails as baseline fallback
      if (prev && prev.output) {
        const pImg = new Image();
        pImg.src = getThumbnailUrl(prev.output);
      }
      if (next && next.output) {
        const nImg = new Image();
        nImg.src = getThumbnailUrl(next.output);
      }
    }

    function updateModalToSlide(index) {
      if (index < 0 || index >= currentFilteredRows.length) return;
      currentModalIndex = index;
      const x = currentFilteredRows[index];
      const col = getCollection();
      const displayName = x.city || x.title || x.name;
      const promptText = x.prompt || "";
      const liked = isLiked(x.output);
      const seriesTitle = x.seriesTitle || col.title || "橡胶戳系列";

      const thisToken = ++currentHiresToken;
      const thumbUrl = getThumbnailUrl(x.output);
      const detailWebpUrl = getDetailWebpUrl(x.output);
      const origUrl = x.output;

      const isAlreadyCached = preloadedDetailUrls.has(detailWebpUrl);

      if (isAlreadyCached) {
        // High-res detail WebP is already preloaded into memory/disk cache! Direct instant render without thumbnail flash
        noteMainImg.src = detailWebpUrl;
        noteMainImg.alt = displayName;
      } else {
        // 1. Current slide main image: render sharp thumbnail immediately (no blur)
        noteMainImg.src = thumbUrl;
        noteMainImg.alt = displayName;

        // Background high-res loader: decode lightweight high-res WebP (~280KB) in memory, then swap seamlessly
        const hiresLoader = new Image();
        hiresLoader.src = detailWebpUrl;
        const swapToHires = () => {
          if (currentHiresToken === thisToken && currentModalIndex === index) {
            preloadedDetailUrls.add(detailWebpUrl);
            noteMainImg.src = hiresLoader.src;
          }
        };
        if (hiresLoader.decode) {
          hiresLoader.decode().then(swapToHires).catch(() => {
            // Fallback to origUrl if detail webp failed
            hiresLoader.src = origUrl;
            if (hiresLoader.decode) hiresLoader.decode().then(swapToHires).catch(swapToHires);
            else hiresLoader.onload = swapToHires;
          });
        } else {
          hiresLoader.onload = swapToHires;
          hiresLoader.onerror = () => {
            hiresLoader.src = origUrl;
            hiresLoader.onload = swapToHires;
          };
        }
      }

      // Populate adjacent prev & next slides
      populateSwiperSlides(index);

      // Trigger lookahead preloader for subsequent slides (focus on +1, +2, +3, +4, -1)
      preloadAdjacentDetails(index);

      noteAuthorName.textContent = seriesTitle + ` · 第 ${String(x.id).padStart(2, "0")} 枚`;

      noteTitle.textContent = displayName;
      noteDesc.textContent = x.features || (x.keywords || []).join(" · ") || "";
      notePromptText.textContent = promptText;

      syncNoteLikeUI(liked);
    }

    function finishSlide(direction, currentOffset, wrapWidth, velocity) {
      if (isAnimatingSlide) {
        completeSlideTransition(animatingDirection);
      }
      isAnimatingSlide = true;
      animatingDirection = direction;
      const targetX = direction === 1 ? -wrapWidth : wrapWidth;

      const remainingDistance = Math.abs(targetX - (currentOffset || 0));
      let durationMs = Math.round(Math.min(220, Math.max(140, (remainingDistance / wrapWidth) * 220)));
      if (velocity && Math.abs(velocity) > 0.4) {
        durationMs = Math.round(Math.max(120, durationMs * 0.75));
      }

      noteSwiperTrack.style.transition = `transform ${durationMs}ms cubic-bezier(0.16, 1, 0.3, 1)`;
      noteSwiperTrack.style.transform = `translate3d(${targetX}px, 0, 0)`;

      slideAnimationTimer = setTimeout(() => {
        completeSlideTransition(direction);
      }, durationMs);
    }

    function completeSlideTransition(direction) {
      if (slideAnimationTimer) {
        clearTimeout(slideAnimationTimer);
        slideAnimationTimer = null;
      }
      let newIdx = currentModalIndex + direction;
      if (newIdx < 0) newIdx = currentFilteredRows.length - 1;
      else if (newIdx >= currentFilteredRows.length) newIdx = 0;

      noteSwiperTrack.style.transition = "none";
      noteSwiperTrack.style.transform = "translate3d(0, 0, 0)";

      updateModalToSlide(newIdx);
      isAnimatingSlide = false;
      animatingDirection = 0;
    }

    function navNote(delta) {
      if (!noteModal.classList.contains("open")) return;
      const wrapWidth = noteSwiperWrap ? noteSwiperWrap.clientWidth : 400;
      finishSlide(delta, 0, wrapWidth, 0);
    }

    function openNoteDetail(index, fromPopState) {
      if (index < 0 || index >= currentFilteredRows.length) return;
      if (slideAnimationTimer) {
        clearTimeout(slideAnimationTimer);
        slideAnimationTimer = null;
      }
      isAnimatingSlide = false;
      animatingDirection = 0;
      isSwiperDragging = false;
      isImmersive = false;
      noteModal.classList.remove("immersive-mode");
      if (noteSwiperTrack) {
        noteSwiperTrack.style.transition = "none";
        noteSwiperTrack.style.transform = "translate3d(0, 0, 0)";
      }
      const noteWindow = noteModal.querySelector(".note-window");
      if (noteWindow) {
        noteWindow.style.transform = "";
        noteWindow.style.transition = "";
        noteWindow.style.opacity = "";
      }
      noteModal.style.backgroundColor = "";
      updateModalToSlide(index);
      if (noteScrollBody) noteScrollBody.scrollTop = 0;
      noteModal.classList.add("open");
      document.body.style.overflow = "hidden";

      if (!fromPopState) {
        if (!history.state || history.state.modal !== "detail") {
          history.pushState({ modal: "detail", index: index }, "");
        } else {
          history.replaceState({ modal: "detail", index: index }, "");
        }
      }
    }

    function closeNoteDetail(fromPopState) {
      clearTimeout(detailPreloadTimer);
      if (slideAnimationTimer) {
        clearTimeout(slideAnimationTimer);
        slideAnimationTimer = null;
      }
      isAnimatingSlide = false;
      animatingDirection = 0;
      isSwiperDragging = false;
      if (!fromPopState && history.state && (history.state.modal === "detail" || history.state.modal === "share")) {
        history.back();

      }
      if (isImmersive) {
        toggleImmersiveMode(false);
      }
      noteModal.classList.remove("open");
      const noteWindow = noteModal.querySelector(".note-window");
      if (noteWindow) {
        noteWindow.style.transform = "";
        noteWindow.style.transition = "";

    async function downloadShareCardPoster() {
      if (!currentShareItem) return;
      const item = currentShareItem;
      const col = getCollection();
      const displayName = item.city || item.title || item.name || "橡胶戳作品";
      const seriesTitle = item.seriesTitle || col.title || "华夏胜景系列";
      const shareUrl = getShareUrl(item);

      const origBtnHtml = btnShareSavePoster.innerHTML;
      btnShareSavePoster.innerHTML = `<span>正在生成高清海报...</span>`;
      btnShareSavePoster.disabled = true;

      try {
        // 1. Load image first to read natural aspect ratio
        const img = new Image();
        img.crossOrigin = "anonymous";
        await new Promise((resolve) => {
          img.onload = resolve;
          img.onerror = () => {
            img.src = getThumbnailUrl(item.output);
            img.onload = resolve;
            img.onerror = resolve;
          };
          img.src = item.output;
        });

        const imgW = img.naturalWidth || img.width || 4;
        const imgH = img.naturalHeight || img.height || 5;
        const imgRatio = imgW / imgH;

        // Dynamic Poster Canvas Sizing (Zero letterboxing, fills width)
        const W = 840;
        const pad = 48;
        const artW = W - pad * 2; // 744
        const artH = Math.round(artW / imgRatio);

        const artY = 96;
        const titleY = artY + artH + 46;
        const featuresY = titleY + 40;
        const lineY = featuresY + 36;
        const qrSize = 136;
        const qrBoxY = lineY + 22;
        const H = qrBoxY + qrSize + 48;

        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext("2d");

        // 1. Draw Background (Warm Xuan paper tone)
        ctx.fillStyle = "#fbf8f2";
        ctx.fillRect(0, 0, W, H);

        // 2. Draw Decorative Borders
        ctx.strokeStyle = "#e5dbcb";
        ctx.lineWidth = 3;
        ctx.strokeRect(16, 16, W - 32, H - 32);

        ctx.strokeStyle = "#eedecb";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(26, 26, W - 52, H - 52);

        // 3. Top Header: Minimal Series Title Centered
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#666666";
        ctx.font = "500 20px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
        ctx.fillText(seriesTitle, W / 2, 58);

        // 4. Draw Stamp Artwork Image (completely fills width, no side gutters)
        ctx.save();
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(pad, artY, artW, artH, 14);
          ctx.clip();
        }
        ctx.drawImage(img, pad, artY, artW, artH);
        ctx.restore();

        // 5. Artwork Title & Features
        ctx.textAlign = "left";
        ctx.fillStyle = "#1a1a1a";
        ctx.font = "bold 32px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif";
        ctx.fillText(displayName, pad, titleY);

        ctx.fillStyle = "#666666";
        ctx.font = "20px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
        const features = item.features || (item.keywords || []).join(" · ") || "";
        ctx.fillText(features.length > 34 ? features.slice(0, 33) + "..." : features, pad, featuresY);

        // 6. Dashed Separator Line
        ctx.beginPath();
        ctx.setLineDash([8, 6]);
        ctx.strokeStyle = "#ded3c2";
        ctx.lineWidth = 1.5;
        ctx.moveTo(pad, lineY);
        ctx.lineTo(W - pad, lineY);
        ctx.stroke();
        ctx.setLineDash([]);

        // 7. Footer Left Typography & Right QR Code
        ctx.fillStyle = "#222222";
        ctx.font = "bold 22px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
        ctx.fillText("长按识别二维码", pad, qrBoxY + 36);

        ctx.fillStyle = "#777777";
        ctx.font = "18px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
        ctx.fillText("鉴赏与获取 Prompt", pad, qrBoxY + 76);

        // Right QR Code
        if (typeof QRCode === "undefined") {
          await loadScriptOnce("qrcode.min.js");
        }
        const qrCanvas = document.createElement("canvas");
        await QRCode.toCanvas(qrCanvas, shareUrl, {
          width: qrSize,
          margin: 1,
          color: { dark: "#222222", light: "#ffffff" }
        });

        const qrBoxX = W - pad - qrSize;
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#e5ddcf";
        ctx.lineWidth = 1.5;
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(qrBoxX - 6, qrBoxY - 6, qrSize + 12, qrSize + 12, 10);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.fillRect(qrBoxX - 6, qrBoxY - 6, qrSize + 12, qrSize + 12);
          ctx.strokeRect(qrBoxX - 6, qrBoxY - 6, qrSize + 12, qrSize + 12);
        }
        ctx.drawImage(qrCanvas, qrBoxX, qrBoxY, qrSize, qrSize);

        // 8. Download Generated Poster Blob
        const cleanTitle = displayName.replace(/[\/:*?"<>|]/g, "_");
        canvas.toBlob(blob => {
          if (!blob) throw new Error("Canvas export failed");
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `橡胶戳分享海报_${cleanTitle}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast(`成功保存「${displayName}」分享海报！`);
        }, "image/png");

      } catch (err) {
        console.error("Share card poster error:", err);
        showToast("海报生成失败，请稍后重试");
      } finally {
        btnShareSavePoster.innerHTML = origBtnHtml;
        btnShareSavePoster.disabled = false;
      }
    }

    function shareCurrentNote() {

    if (shareModal) {
      shareModal.onclick = (e) => {

      };
