    function setupSwiperGestures() {
      if (!noteSwiperWrap || !noteSwiperTrack) return;
      const noteWindow = noteModal.querySelector(".note-window");

      let isEdgeSwipeBack = false;
      let edgeStartX = 0;
      let edgeCurrentX = 0;

      let lastTouchX = 0;
      let lastTouchTime = 0;
      let touchVelocityX = 0;

      // Touch events (Mobile)
      noteSwiperWrap.addEventListener("touchstart", e => {
        if (e.touches.length !== 1) return;

        // If slide transition is still settling, instantly fast-forward so this touch is never missed
        if (isAnimatingSlide) {
          completeSlideTransition(animatingDirection);
        }

        const startX = e.touches[0].clientX;
        const startY = e.touches[0].clientY;

        // Screen edge guard (only screen edge <= 20px)
        if (startX <= 20) {
          isEdgeSwipeBack = true;
          isSwiperDragging = false;
          edgeStartX = startX;
          edgeCurrentX = startX;
          if (noteWindow) noteWindow.style.transition = "none";
          return;
        }

        isEdgeSwipeBack = false;
        isSwiperDragging = true;
        swiperStartX = startX;
        swiperStartY = startY;
        swiperCurrentX = startX;
        swiperDeltaX = 0;
        swiperDeltaY = 0;
        isHorizontalSwipe = null;

        lastTouchX = startX;
        lastTouchTime = Date.now();
        touchVelocityX = 0;

        noteSwiperTrack.style.transition = "none";
      }, { passive: true });

      noteSwiperWrap.addEventListener("touchmove", e => {
        if (isEdgeSwipeBack) {
          edgeCurrentX = e.touches[0].clientX;
          const dx = edgeCurrentX - edgeStartX;
          if (dx > 0) {
            if (e.cancelable) e.preventDefault();
            if (noteWindow) {
              noteWindow.style.transform = `translate3d(${dx}px, 0, 0)`;
              const progress = Math.min(dx / 280, 1);
              noteModal.style.backgroundColor = `rgba(0, 0, 0, ${0.85 * (1 - progress * 0.7)})`;
            }
          }
          return;
        }

        if (!isSwiperDragging || e.touches.length !== 1) return;
        swiperCurrentX = e.touches[0].clientX;
        const curY = e.touches[0].clientY;
        swiperDeltaX = swiperCurrentX - swiperStartX;
        swiperDeltaY = curY - swiperStartY;

        const absX = Math.abs(swiperDeltaX);
        const absY = Math.abs(swiperDeltaY);

        // Calculate real-time instantaneous touch velocity (px/ms)
        const now = Date.now();
        const dt = now - lastTouchTime;
        if (dt > 10) {
          touchVelocityX = (swiperCurrentX - lastTouchX) / dt;
          lastTouchX = swiperCurrentX;
          lastTouchTime = now;
        }

        // Direction lock with tolerant angle:
        if (isHorizontalSwipe === null) {
          if (absX >= 7 || absY >= 7) {
            if (absX >= absY * 0.75) {
              isHorizontalSwipe = true;
            } else if (absY > absX * 1.4 && absY >= 12) {
              // Clearly vertical scroll
              isHorizontalSwipe = false;
            }
          }
        }

        if (isHorizontalSwipe === true) {
          if (e.cancelable) e.preventDefault();
          noteSwiperTrack.style.transform = `translate3d(${swiperDeltaX}px, 0, 0)`;
        }
      }, { passive: false });

      const handleTouchEnd = () => {
        if (isEdgeSwipeBack) {
          isEdgeSwipeBack = false;
          const dx = edgeCurrentX - edgeStartX;
          if (dx > 75) {
            if (noteWindow) {
              noteWindow.style.transition = "transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease-out";
              noteWindow.style.transform = `translate3d(${window.innerWidth || 360}px, 0, 0)`;
              noteWindow.style.opacity = "0";
            }
            setTimeout(() => {
              closeNoteDetail();
            }, 200);
          } else {
            if (noteWindow) {
              noteWindow.style.transition = "transform 0.2s cubic-bezier(0.16, 1, 0.3, 1)";
              noteWindow.style.transform = "translate3d(0, 0, 0)";
            }
            noteModal.style.backgroundColor = "";
          }
          return;
        }

        if (!isSwiperDragging) return;
        isSwiperDragging = false;

        // Clean tap without drag (<8px) -> Toggle Immersive Mode!
        if (isHorizontalSwipe !== true && Math.abs(swiperDeltaX) < 8 && Math.abs(swiperDeltaY) < 8) {
          toggleImmersiveMode();
          return;
        }

        if (!isHorizontalSwipe) {
          noteSwiperTrack.style.transition = "transform 0.2s cubic-bezier(0.16, 1, 0.3, 1)";
          noteSwiperTrack.style.transform = "translate3d(0, 0, 0)";
          return;
        }

        const wrapWidth = noteSwiperWrap.clientWidth || 360;
        const distThreshold = Math.min(wrapWidth * 0.15, 52);

        // Responsive flick condition: velocity > 0.25 px/ms with min 15px movement OR displacement > threshold
        const isFlickNext = (touchVelocityX < -0.25 || swiperDeltaX < -distThreshold) && swiperDeltaX < -15;
        const isFlickPrev = (touchVelocityX > 0.25 || swiperDeltaX > distThreshold) && swiperDeltaX > 15;

        if (isFlickNext) {
          finishSlide(1, swiperDeltaX, wrapWidth, touchVelocityX);
        } else if (isFlickPrev) {
          finishSlide(-1, swiperDeltaX, wrapWidth, touchVelocityX);
        } else {
          // Snap back smoothly with spring curve
          noteSwiperTrack.style.transition = "transform 0.22s cubic-bezier(0.16, 1, 0.3, 1)";
          noteSwiperTrack.style.transform = "translate3d(0, 0, 0)";
        }
      };

      noteSwiperWrap.addEventListener("touchend", handleTouchEnd, { passive: true });
      noteSwiperWrap.addEventListener("touchcancel", () => {
        isEdgeSwipeBack = false;
        isSwiperDragging = false;
        isHorizontalSwipe = null;
        noteSwiperTrack.style.transition = "transform 0.2s cubic-bezier(0.16, 1, 0.3, 1)";
        noteSwiperTrack.style.transform = "translate3d(0, 0, 0)";
      }, { passive: true });

      // Mouse Drag support (Desktop)
      let isPointerDown = false;
      let pointerStartX = 0;
      let pointerDeltaX = 0;
      let lastPointerX = 0;
      let lastPointerTime = 0;
      let pointerVelocityX = 0;

      noteSwiperWrap.addEventListener("mousedown", e => {
        if (e.button !== 0) return;
        if (isAnimatingSlide) {
          completeSlideTransition(animatingDirection);
        }
        isPointerDown = true;
        pointerStartX = e.clientX;
        pointerDeltaX = 0;
        lastPointerX = e.clientX;
        lastPointerTime = Date.now();
        pointerVelocityX = 0;
        noteSwiperTrack.style.transition = "none";
      });

      window.addEventListener("mousemove", e => {
        if (!isPointerDown) return;
        pointerDeltaX = e.clientX - pointerStartX;
        const now = Date.now();
        const dt = now - lastPointerTime;
        if (dt > 10) {
          pointerVelocityX = (e.clientX - lastPointerX) / dt;
          lastPointerX = e.clientX;
          lastPointerTime = now;
        }
        noteSwiperTrack.style.transform = `translate3d(${pointerDeltaX}px, 0, 0)`;
      });

      window.addEventListener("mouseup", e => {
        if (!isPointerDown) return;
        isPointerDown = false;
        const wrapWidth = noteSwiperWrap.clientWidth || 360;
        const distThreshold = Math.min(wrapWidth * 0.15, 52);

        if (Math.abs(pointerDeltaX) < 6) {
          if (e.target && e.target.closest("#note-swiper-wrap")) {
            toggleImmersiveMode();
          }
          return;
        }

        const isFlickNext = (pointerVelocityX < -0.25 || pointerDeltaX < -distThreshold) && pointerDeltaX < -15;
        const isFlickPrev = (pointerVelocityX > 0.25 || pointerDeltaX > distThreshold) && pointerDeltaX > 15;

        if (isFlickNext) {
          finishSlide(1, pointerDeltaX, wrapWidth, pointerVelocityX);
        } else if (isFlickPrev) {
          finishSlide(-1, pointerDeltaX, wrapWidth, pointerVelocityX);
        } else {
          noteSwiperTrack.style.transition = "transform 0.22s cubic-bezier(0.16, 1, 0.3, 1)";
          noteSwiperTrack.style.transform = "translate3d(0, 0, 0)";
        }
      });
    }

    function setupShareModalGestures() {
      if (!shareModal) return;
      const shareContainer = shareModal.querySelector(".share-modal-container");
      let startX = 0, currentX = 0, isDragging = false;

      shareModal.addEventListener("touchstart", e => {
        if (e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        currentX = startX;
        isDragging = true;
        if (shareContainer) shareContainer.style.transition = "none";
      }, { passive: true });

      shareModal.addEventListener("touchmove", e => {
        if (!isDragging) return;
        currentX = e.touches[0].clientX;
        const dx = currentX - startX;
        if (dx > 0) {
          if (e.cancelable) e.preventDefault();
          if (shareContainer) {
            shareContainer.style.transform = `translate3d(${dx}px, 0, 0)`;
            shareContainer.style.opacity = `${Math.max(0.15, 1 - dx / 240)}`;
          }
        }
      }, { passive: false });

      shareModal.addEventListener("touchend", () => {
        if (!isDragging) return;
        isDragging = false;
        const dx = currentX - startX;
        if (dx > 75) {
          if (shareContainer) {
            shareContainer.style.transition = "transform 0.2s ease-out, opacity 0.2s ease-out";
            shareContainer.style.transform = `translate3d(${window.innerWidth || 360}px, 0, 0)`;
            shareContainer.style.opacity = "0";
          }
          setTimeout(() => {
            closeShareCard();
          }, 180);
        } else {
          if (shareContainer) {
            shareContainer.style.transition = "transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease-out";
            shareContainer.style.transform = "translate3d(0, 0, 0)";
            shareContainer.style.opacity = "1";
          }
        }
      }, { passive: true });
    }

    function setupFeedGestures() {
      const feedContainer = document.querySelector(".feed-container");
      if (!feedContainer || !gridEl) return;

      let startX = 0, startY = 0;
      let currentX = 0;
      let deltaX = 0, deltaY = 0;
      let isHorizontal = null;
      let lastTouchX = 0, lastTouchTime = 0, velocityX = 0;
      let isSwitching = false;
      let hasDragged = false;

      function getTabs() {
        return Array.from(document.querySelectorAll("#series-nav .xhs-tab")).map(t => t.dataset.series);
      }

      let switchTimer = null;

      function performTabSwitch(direction) {
        const keys = getTabs();
        const currentIdx = keys.indexOf(currentSeriesKey);
        if (currentIdx === -1) return;
        const targetIdx = currentIdx + direction;
        if (targetIdx < 0 || targetIdx >= keys.length) {
          snapBack();
          return;
        }

        isSwitching = true;
        const slideOutX = direction === 1 ? -80 : 80;
        const slideInX = direction === 1 ? 60 : -60;

        gridEl.style.transition = "transform 0.12s ease-out, opacity 0.12s ease-out";
        gridEl.style.transform = `translate3d(${slideOutX}px, 0, 0)`;
        gridEl.style.opacity = "0.2";

        clearTimeout(switchTimer);
        switchTimer = setTimeout(() => {
          switchSeries(keys[targetIdx]);
          window.scrollTo({ top: 0, behavior: "instant" });

          gridEl.style.transition = "none";
          gridEl.style.transform = `translate3d(${slideInX}px, 0, 0)`;
          gridEl.style.opacity = "0.2";

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              gridEl.style.transition = "transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease-out";
              gridEl.style.transform = "translate3d(0, 0, 0)";
              gridEl.style.opacity = "1";
              switchTimer = setTimeout(() => {
                isSwitching = false;
              }, 180);
            });
          });
        }, 120);
      }

      function snapBack() {
        gridEl.style.transition = "transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease-out";
        gridEl.style.transform = "translate3d(0, 0, 0)";
        gridEl.style.opacity = "1";
      }

      // Touch Events (Mobile)
      feedContainer.addEventListener("touchstart", e => {
        if ((noteModal && noteModal.classList.contains("open")) || (shareModal && shareModal.classList.contains("open"))) return;
        if (e.touches.length !== 1) return;
        if (e.target.closest("button") || e.target.closest("input") || e.target.closest(".card-like-btn")) return;

        if (isSwitching) {
          isSwitching = false;
          clearTimeout(switchTimer);
          gridEl.style.transition = "none";
          gridEl.style.transform = "translate3d(0, 0, 0)";
          gridEl.style.opacity = "1";
        }

        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        currentX = startX;
        deltaX = 0;
        deltaY = 0;
        isHorizontal = null;
        lastTouchX = startX;
        lastTouchTime = Date.now();
        velocityX = 0;
        hasDragged = false;
        gridEl.style.transition = "none";
      }, { passive: true });

      feedContainer.addEventListener("touchmove", e => {
        if ((noteModal && noteModal.classList.contains("open")) || (shareModal && shareModal.classList.contains("open"))) return;
        if (e.touches.length !== 1) return;

        currentX = e.touches[0].clientX;
        const curY = e.touches[0].clientY;
        deltaX = currentX - startX;
        deltaY = curY - startY;

        const absX = Math.abs(deltaX);
        const absY = Math.abs(deltaY);

        const now = Date.now();
        const dt = now - lastTouchTime;
        if (dt > 10) {
          velocityX = (currentX - lastTouchX) / dt;
          lastTouchX = currentX;
          lastTouchTime = now;
        }

        if (isHorizontal === null) {
          if (absX >= 8 || absY >= 8) {
            if (absX >= absY * 1.05) {
              isHorizontal = true;
            } else if (absY > absX * 1.3 && absY >= 12) {
              isHorizontal = false;
            }
          }
        }

        if (isHorizontal === true) {
          if (e.cancelable) e.preventDefault();
          hasDragged = true;
          const keys = getTabs();
          const currentIdx = keys.indexOf(currentSeriesKey);
          let moveX = deltaX;
          if ((currentIdx === 0 && deltaX > 0) || (currentIdx === keys.length - 1 && deltaX < 0)) {
            moveX = deltaX * 0.26;
          }
          gridEl.style.transform = `translate3d(${moveX}px, 0, 0)`;
        }
      }, { passive: false });

      feedContainer.addEventListener("touchend", () => {
        if (isHorizontal !== true) return;
        isHorizontal = null;

        const keys = getTabs();
        const currentIdx = keys.indexOf(currentSeriesKey);
        const distThreshold = Math.min(window.innerWidth * 0.14, 48);

        const isFlickNext = (velocityX < -0.22 || deltaX < -distThreshold) && deltaX < -15;
        const isFlickPrev = (velocityX > 0.22 || deltaX > distThreshold) && deltaX > 15;

        if (isFlickNext && currentIdx < keys.length - 1) {
          performTabSwitch(1);
        } else if (isFlickPrev && currentIdx > 0) {
          performTabSwitch(-1);
        } else {
          snapBack();
        }
      }, { passive: true });

      feedContainer.addEventListener("touchcancel", () => {
        isHorizontal = null;
        snapBack();
      }, { passive: true });

      // Mouse drag support (Desktop)
      let isMouseDown = false;
      let mouseStartX = 0;
      let mouseDeltaX = 0;
      let lastMouseX = 0, lastMouseTime = 0, mouseVelocityX = 0;

      feedContainer.addEventListener("mousedown", e => {
        if (e.button !== 0 || (noteModal && noteModal.classList.contains("open")) || (shareModal && shareModal.classList.contains("open"))) return;
        if (e.target.closest("button") || e.target.closest("input") || e.target.closest(".card-like-btn")) return;

        if (isSwitching) {
          isSwitching = false;
          clearTimeout(switchTimer);
          gridEl.style.transition = "none";
          gridEl.style.transform = "translate3d(0, 0, 0)";
          gridEl.style.opacity = "1";
        }

        isMouseDown = true;
        mouseStartX = e.clientX;
        mouseDeltaX = 0;
        lastMouseX = e.clientX;
        lastMouseTime = Date.now();
        mouseVelocityX = 0;
        gridEl.style.transition = "none";
      });

      window.addEventListener("mousemove", e => {
        if (!isMouseDown) return;
        mouseDeltaX = e.clientX - mouseStartX;
        const now = Date.now();
        const dt = now - lastMouseTime;
        if (dt > 10) {
          mouseVelocityX = (e.clientX - lastMouseX) / dt;
          lastMouseX = e.clientX;
          lastMouseTime = now;
        }

        if (Math.abs(mouseDeltaX) > 6) {
          hasDragged = true;
          document.body.style.userSelect = "none";
          const keys = getTabs();
          const currentIdx = keys.indexOf(currentSeriesKey);
          let moveX = mouseDeltaX;
          if ((currentIdx === 0 && mouseDeltaX > 0) || (currentIdx === keys.length - 1 && mouseDeltaX < 0)) {
            moveX = mouseDeltaX * 0.26;
          }
          gridEl.style.transform = `translate3d(${moveX}px, 0, 0)`;
        }
      });

      window.addEventListener("mouseup", e => {
        if (!isMouseDown) return;
        isMouseDown = false;
        document.body.style.userSelect = "";

        const keys = getTabs();
        const currentIdx = keys.indexOf(currentSeriesKey);
        const distThreshold = Math.min(window.innerWidth * 0.14, 48);

        const isFlickNext = (mouseVelocityX < -0.22 || mouseDeltaX < -distThreshold) && mouseDeltaX < -15;
        const isFlickPrev = (mouseVelocityX > 0.22 || mouseDeltaX > distThreshold) && mouseDeltaX > 15;

        if (isFlickNext && currentIdx < keys.length - 1) {
          performTabSwitch(1);
        } else if (isFlickPrev && currentIdx > 0) {
          performTabSwitch(-1);
        } else {
          snapBack();
        }

        setTimeout(() => { hasDragged = false; }, 50);
      });

      // Prevent accidental card opening after dragging
      feedContainer.addEventListener("click", e => {
        if (hasDragged) {
          e.stopPropagation();
          e.preventDefault();
        }
      }, true);
    }

    setupSwiperGestures();
    setupShareModalGestures();
    setupFeedGestures();

    window.addEventListener("popstate", () => {
      if (shareModal && shareModal.classList.contains("open")) {
        closeShareCard(true);
        return;
      }
      if (noteModal && noteModal.classList.contains("open")) {
        closeNoteDetail(true);
      }
    });

    noteModal.onclick = (e) => {
      if (e.target.id === "note-detail-modal") {
        if (isImmersive) {
          toggleImmersiveMode(false);
        } else {
          closeNoteDetail();
        }
      }
    };

    window.addEventListener("keydown", e => {
      if (shareModal && shareModal.classList.contains("open")) {
        if (e.key === "Escape") {
          closeShareCard();
          return;
        }
      }
      if (!noteModal.classList.contains("open")) return;
      if (e.key === "Escape") {
        if (isImmersive) {
          toggleImmersiveMode(false);
        } else {
          closeNoteDetail();
        }
      } else if (e.key === "ArrowLeft") {
        navNote(-1);
      } else if (e.key === "ArrowRight") {
        navNote(1);
      }
    });

    const urlParams = new URLSearchParams(window.location.search);

    if (urlParams.get("seedLikes") === "1" || urlParams.get("seedLikes") === "true") {
      const demoLikes = [
        "images/scenic_spots/01_故宫博物院.png",
        "images/scenic_spots/02_八达岭长城.png",
        "images/poetry/01_竹外桃花三两枝.png",
        "images/poetry/50_一蓑烟雨任平生.png",
        "images/wildlife/01_大熊猫.png",
        "images/marine/01_蓝鲸.png"
      ];
      localStorage.setItem(LIKES_STORAGE_KEY, JSON.stringify(demoLikes));
    }

    const rawHash = window.location.hash.replace("#", "");
    const cleanHash = rawHash.split("?")[0];
    if (cleanHash && (window.COLLECTIONS[cleanHash] || cleanHash === "favorites" || cleanHash === "all")) {
      switchSeries(cleanHash);
    } else {
      render();
    }

    updateLikesUI();

    const modalParam = urlParams.get("modal");
    if (modalParam !== null) {
      const idx = parseInt(modalParam, 10);
      if (!isNaN(idx) && idx >= 0 && currentFilteredRows[idx]) {
        openNoteDetail(idx);
      }
    }

    const shareParam = urlParams.get("share");
    if (shareParam !== null) {
      const sIdx = parseInt(shareParam, 10);
      if (!isNaN(sIdx) && currentFilteredRows[sIdx]) {
        openShareCard(currentFilteredRows[sIdx]);
      }
    }

    const immersiveParam = urlParams.get("immersive");
    if (immersiveParam === "1" || immersiveParam === "true") {
      toggleImmersiveMode(true);
    }

    const itemParam = urlParams.get("item") || (rawHash.includes("item=") ? new URLSearchParams(rawHash.split("?")[1] || "").get("item") : null);
    if (itemParam) {
      let targetItem = currentFilteredRows.find(x => (x.name === itemParam || x.city === itemParam || x.title === itemParam || String(x.id) === itemParam));
      if (!targetItem) {
        for (const [sKey, sCol] of Object.entries(window.COLLECTIONS)) {
          const list = sCol.items || sCol.data || [];
          const itm = list.find(x => (x.name === itemParam || x.city === itemParam || x.title === itemParam || String(x.id) === itemParam));
          if (itm) {
            switchSeries(sKey);
            targetItem = itm;
            break;
          }
        }
      }
      if (targetItem) {
        const foundIdx = currentFilteredRows.indexOf(targetItem);
        if (foundIdx !== -1) {
          openNoteDetail(foundIdx);
        }
      }
    }
  </script>
</body>
